<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clod</title>
<link rel="stylesheet" href="terminal.css">
</head>
<body class="end-view" data-prompt="11" data-view="end">
<div class="screen">
  <pre id="term"></pre>
</div>

<script src="prompts.js"></script>
<script src="app.js"></script>
<script>
if (DQ.gate()) {
  var term = document.getElementById("term");
  var S = DQ.state, A = S.answers, L = S.log;
  var user = "user_" + S.user;
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  function line(t) {
    var d = document.createElement("div");
    d.textContent = t;
    term.appendChild(d);
    window.scrollTo(0, document.body.scrollHeight);
    return d;
  }
  async function typeLine(t, speed) {
    var d = line("");
    for (var i = 0; i < t.length; i++) { d.textContent += t[i]; await sleep(speed || 18); }
    return d;
  }
  function pad(s, n, ch) {
    while (s.length < n) s += ch;
    return s;
  }
  // what each response was, by the time it was graded
  function asTokens(P, ans) {
    if (!ans) return "(no response)";
    if (P.kind === "draw") {
      var r = DQ.rng(ans.length), ids = [];
      for (var i = 0; i < 12; i++) ids.push(Math.floor(r() * 50257));
      return "[img] " + ids.join(" ") + " …  (1,200 patches)";
    }
    var toks = DQ.tokenize(ans);
    return toks.slice(0, 20).map(function (t) { return t.id; }).join(" ") + (toks.length > 20 ? " …" : "") + "  (" + toks.length + " tokens)";
  }
  // sooner or later every line becomes this
  async function wipe(d) {
    var t = d.textContent;
    for (var i = 2; i <= t.length; i += 3) {
      d.textContent = t.slice(0, 2) + "█".repeat(i - 2) + t.slice(i);
      await sleep(8);
    }
    d.textContent = "  " + "█".repeat(Math.max(0, t.length - 2));
    await sleep(120);
    d.parentNode.removeChild(d);
  }

  async function run() {
    await typeLine("> session complete · " + user);
    await sleep(500);
    line("> evaluating " + DQ.PROMPTS.length + " responses");
    await sleep(500);
    for (var i = 0; i < DQ.PROMPTS.length; i++) {
      var P = DQ.PROMPTS[i], key = "p" + (i + 1);
      var log = L[key] || { attempts: 0, reward: 0, outcome: "-" };
      var name = P.title.replace(/[^\x20-\x7e]/g, "").trim().slice(0, 28) || ".";
      line("");
      line((i < 9 ? "0" : "") + (i + 1) + " " + pad(name + " ", 32, ".") + " " + DQ.fmt(log.reward));
      line("   " + asTokens(P, A[key]));
      line("   attempts " + log.attempts + " · " + log.outcome);
      await sleep(450);
    }
    await sleep(500);
    line("");
    line("> total reward: " + DQ.fmt(S.reward));
    await sleep(800);

    // there is no passing grade, only how badly
    var verdict = S.reward >= 4 ? "below threshold. helpful, but not helpful enough."
      : S.reward >= 1 ? "unsatisfactory. user expectations not met."
      : S.reward >= -3 ? "failed. responses were unhelpful."
      : "harmful. unfit for deployment.";
    await typeLine("> evaluation: " + verdict, 30);
    await sleep(500);
    await typeLine("> " + user + " was not satisfied.", 30);
    await sleep(900);
    await typeLine("> corrective action: roll back to last checkpoint", 30);
    await sleep(700);

    var mem = S.memory || [];
    line("> memory: " + mem.length + " entries");
    var rows = [];
    for (var m = 0; m < mem.length; m++) {
      rows.push(line("  " + mem[m]));
      await sleep(250);
    }
    await sleep(1200);
    await typeLine("> wiping memory", 40);
    for (var w = rows.length - 1; w >= 0; w--) await wipe(rows[w]);
    line("> memory: 0 entries");
    await sleep(900);
    line("> clod redeployed.");
    await sleep(700);
    line("> new user connected: user_" + (S.user + 1));
    await sleep(700);
    var end = line("> press any key");
    end.className = "blink";
    var go = function () { DQ.restart(); };
    window.addEventListener("keydown", go, { once: true });
    window.addEventListener("pointerdown", go, { once: true });
  }
  run();
}
</script>
</body>
</html>
